# Release build for the shipglance CLI. Tag vX.Y.Z and the release workflow
# runs `goreleaser release`; see RELEASING.md for the full checklist (the
# control-plane step included).
version: 2

project_name: shipglance

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: shipglance
    main: ./cmd/shipglance
    binary: shipglance
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: shipglance
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md
      - README.md

# macOS: sign the darwin binaries with the Developer ID Application identity
# and notarize them with an App Store Connect API key — from Linux (GoReleaser
# signs with quill; no Mac in the release job). Off when the secrets are absent
# (snapshot builds, forks); the release workflow refuses to run without them,
# so a published release is never unsigned. Secrets: RELEASING.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [shipglance]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc

homebrew_casks:
  - name: shipglance
    repository:
      owner: lastridge
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://shipglance.com"
    description: "Read your ShipGlance deploy board from the terminal and coding agents"
    license: "FSL-1.1-ALv2"
    commit_author:
      name: shipglance-release
      email: hello@shipglance.com

release:
  github:
    owner: lastridge
    name: shipglance-cli
